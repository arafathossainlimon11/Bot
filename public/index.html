<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Reaction Manager</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    h2 { margin-top: 0; color: #38bdf8; font-size: 22px; text-align: center; }
    label { font-size: 13px; color: #94a3b8; margin-top: 10px; display: block; }
    input { width: 100%; padding: 12px; margin: 6px 0 14px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; }
    input:focus { outline: none; border-color: #38bdf8; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px; transition: 0.2s; }
    button:hover { background: #1d4ed8; }
    .btn-sync { background: #059669; margin-top: 15px; }
    .btn-sync:hover { background: #047857; }
    .hidden { display: none; }
    .status { margin-top: 15px; font-size: 13px; text-align: center; color: #38bdf8; word-break: break-all; }
    .bot-list-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; max-height: 180px; overflow-y: auto; margin-top: 10px; }
    .bot-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #1e293b; font-size: 13px; }
    .bot-item:last-child { border-bottom: none; }
    .bot-name { color: #4ade80; font-weight: bold; }
    .bot-token { color: #64748b; font-size: 11px; }
  </style>
</head>
<body>

  <!-- লগইন বক্স -->
  <div class="card" id="loginCard">
    <h2>Admin Access</h2>
    <label>পাসওয়ার্ড দিন</label>
    <input type="password" id="passInput" placeholder="Enter Admin Password">
    <button onclick="login()">Login</button>
    <div class="status" id="loginStatus"></div>
  </div>

  <!-- ড্যাশবোর্ড বক্স -->
  <div class="card hidden" id="dashboardCard">
    <h2>Bot Reaction Panel</h2>
    
    <label>বট ইউজারনেম (যেমন: @MyNewBot)</label>
    <input type="text" id="botUsername" placeholder="@username">

    <label>বট টোকেন (BotFather থেকে পাওয়া)</label>
    <input type="text" id="botToken" placeholder="123456789:ABCdef...">

    <button onclick="addBot()">+ Add & Activate Bot</button>
    <button class="btn-sync" onclick="syncAll()">⚡ Sync All Bots to Channel</button>

    <div class="status" id="dashStatus"></div>

    <h4 style="margin: 20px 0 5px; font-size: 14px; color: #cbd5e1;">
      Active Bots (<span id="botCount">0</span>):
    </h4>
    <div class="bot-list-box" id="botList"></div>
  </div>

  <script>
    let savedPass = "";

    async function login() {
      const pass = document.getElementById('passInput').value;
      const res = await fetch('/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'login', password: pass })
      });
      const data = await res.json();
      if (data.success) {
        savedPass = pass;
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('dashboardCard').classList.remove('hidden');
        renderBots(data.bots);
      } else {
        document.getElementById('loginStatus').innerText = data.message;
      }
    }

    async function addBot() {
      const username = document.getElementById('botUsername').value;
      const token = document.getElementById('botToken').value;

      if (!username || !token) {
        return alert("ইউজারনেম এবং টোকেন দুটিই প্রদান করুন!");
      }

      document.getElementById('dashStatus').innerText = "বট প্রসেস করা হচ্ছে...";

      const res = await fetch('/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'add_bot',
          password: savedPass,
          username: username,
          token: token,
          siteUrl: window.location.origin
        })
      });

      const data = await res.json();
      if (data.success) {
        document.getElementById('dashStatus').innerText = data.message;
        document.getElementById('botUsername').value = "";
        document.getElementById('botToken').value = "";
        renderBots(data.bots);
      } else {
        document.getElementById('dashStatus').innerText = data.message || "সমস্যা হয়েছে!";
      }
    }

    async function syncAll() {
      document.getElementById('dashStatus').innerText = "সব বট চ্যানেলে কানেক্ট করা হচ্ছে...";
      const res = await fetch('/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'sync_all',
          password: savedPass,
          siteUrl: window.location.origin
        })
      });

      const data = await res.json();
      if (data.success) {
        document.getElementById('dashStatus').innerText = "✅ " + data.message;
      }
    }

    function renderBots(bots) {
      document.getElementById('botCount').innerText = bots ? bots.length : 0;
      const container = document.getElementById('botList');
      container.innerHTML = "";
      
      if (!bots || bots.length === 0) {
        container.innerHTML = "<div style='color: #64748b; font-size: 12px; text-align: center; padding: 10px;'>কোনো বট পাওয়া যায়নি।</div>";
        return;
      }

      bots.forEach(b => {
        const item = document.createElement('div');
        item.className = 'bot-item';
        const maskedToken = b.token ? b.token.substring(0, 8) + "..." + b.token.substring(b.token.length - 4) : "";
        item.innerHTML = `
          <div>
            <div class="bot-name">${b.username}</div>
            <div class="bot-token">${maskedToken}</div>
          </div>
          <span style="color: #38bdf8; font-size: 11px;">Active</span>
        `;
        container.appendChild(item);
      });
    }
  </script>
</body>
      </html>
