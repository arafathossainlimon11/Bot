<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Reaction Admin Panel</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background: #1d4ed8; }
    .hidden { display: none; }
    .status { margin-top: 15px; font-size: 14px; color: #38bdf8; }
  </style>
</head>
<body>

  <div class="card" id="loginCard">
    <h2>Admin Login</h2>
    <input type="password" id="passInput" placeholder="Enter Admin Password">
    <button onclick="login()">Login</button>
    <div class="status" id="loginStatus"></div>
  </div>

  <div class="card hidden" id="dashboardCard">
    <h2>Auto Reaction Panel</h2>
    <p style="font-size: 13px; color: #94a3b8;">চ্যানেলে পোস্ট হওয়া মাত্রই সব বট অটো-রিয়াকশন দেওয়া শুরু করবে।</p>
    <button onclick="activateWebhooks()">Sync All Bots to Channel</button>
    <div class="status" id="dashStatus"></div>
  </div>

  <script>
    let savedPass = "";

    async function login() {
      const pass = document.getElementById('passInput').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pass })
      });
      const data = await res.json();
      if (data.success) {
        savedPass = pass;
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('dashboardCard').classList.remove('hidden');
      } else {
        document.getElementById('loginStatus').innerText = "Wrong Password!";
      }
    }

    async function activateWebhooks() {
      document.getElementById('dashStatus').innerText = "Connecting bots...";
      const siteUrl = window.location.origin;
      const res = await fetch('/api/setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: savedPass, siteUrl: siteUrl })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('dashStatus').innerText = "All bots connected successfully!";
      } else {
        document.getElementById('dashStatus').innerText = "Failed to connect!";
      }
    }
  </script>
</body>
  </html>
